<svg
  width="550"
  height="270"
  viewBox="0 0 550 270"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .bubble {
      fill: #e9e9eb;
    }

    text {
      fill: #242424;
      font-size: 18px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      letter-spacing: -0.02em;
    }

    .emoji {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif,
        "Apple Color Emoji",
        "Segoe UI Emoji",
        "Segoe UI Symbol";
    }

    a {
      fill: #0079ff;
      text-decoration: none;
      cursor: pointer;
    }

    a:hover text {
      fill: #0066d6;
    }

    .typing-1 {
      opacity: 0;
      animation: fade-in-out 1.5s;
    }

    .msg-1 {
      animation:
        wait 1.7s,
        msg-1 0.2s 1.7s forwards;
    }

    .typing-2 {
      opacity: 0;
      animation:
        wait 2.5s,
        fade-in-out 1.5s 2.5s;
    }

    .msg-2 {
      animation:
        wait 4.2s,
        msg-2 0.2s 4.2s forwards;
    }

    .typing-5 {
      opacity: 0;
      animation:
        wait 5s,
        fade-in-out 1.5s 5s;
    }

    .msg-5 {
      animation:
        wait 6.7s,
        msg-5 0.2s 6.7s forwards;
    }

    .msg-7 {
      animation:
        wait 9.2s,
        msg-7 0.2s 9.2s forwards;
    }

    .msg-8 {
      animation:
        wait 11.7s,
        msg-8 0.2s 11.7s forwards;
    }

    @keyframes wait {
      0%,
      100% {
        opacity: 0;
      }
    }

    @keyframes fade-in-out {
      0%,
      100% {
        opacity: 0;
      }

      25%,
      90% {
        opacity: 1;
      }
    }

    @keyframes msg-1 {
      0% {
        opacity: 0;
        transform: translate(10px, 5px);
      }

      100% {
        opacity: 1;
        transform: translate(10px, 0);
      }
    }

    @keyframes msg-2 {
      0% {
        opacity: 0;
        transform: translate(10px, 53px);
      }

      100% {
        opacity: 1;
        transform: translate(10px, 48px);
      }
    }

    @keyframes msg-5 {
      0% {
        opacity: 0;
        transform: translate(10px, 125px);
      }

      100% {
        opacity: 1;
        transform: translate(10px, 120px);
      }
    }

    @keyframes msg-7 {
      0% {
        opacity: 0;
        transform: translate(10px, 173px);
      }

      100% {
        opacity: 1;
        transform: translate(10px, 168px);
      }
    }

    @keyframes msg-8 {
      0% {
        opacity: 0;
        transform: translate(10px, 221px);
      }

      100% {
        opacity: 1;
        transform: translate(10px, 216px);
      }
    }

    @media (prefers-color-scheme: dark) {
      .bubble {
        fill: #3b3b3d;
      }

      text {
        fill: #dcdcdc;
      }

      a {
        fill: #0c82f9;
      }

      a:hover text {
        fill: #55a8ff;
      }
    }
  </style>

  <!-- Typing indicator 1 -->
  <g transform="translate(10, 0)" class="typing-1">
    <rect width="68" height="42" rx="18.0355" class="bubble" />

    <circle cx="24" cy="21" r="4" fill="#8e8e93" />
    <circle cx="34" cy="21" r="4" fill="#8e8e93" />
    <circle cx="44" cy="21" r="4" fill="#8e8e93" />
  </g>

  <!-- Message 1 -->
  <g transform="translate(10, 0)" class="msg-1">
    <rect width="350" height="42" rx="18.0355" class="bubble" />

    <text x="15" y="27">
      Hey, I'm Dagim Zeru 👋
    </text>
  </g>

  <!-- Typing indicator 2 -->
  <g transform="translate(10, 48)" class="typing-2">
    <rect width="68" height="42" rx="18.0355" class="bubble" />

    <circle cx="24" cy="21" r="4" fill="#8e8e93" />
    <circle cx="34" cy="21" r="4" fill="#8e8e93" />
    <circle cx="44" cy="21" r="4" fill="#8e8e93" />
  </g>

  <!-- Message 2 -->
  <g transform="translate(10, 48)" class="msg-2">
    <rect width="500" height="42" rx="18.0355" class="bubble" />

    <text x="15" y="27">
      Blockchain developer &amp; Web3 builder
    </text>
  </g>

  <!-- Typing indicator 5 -->
  <g transform="translate(10, 120)" class="typing-5">
    <rect width="68" height="42" rx="18.0355" class="bubble" />

    <circle cx="24" cy="21" r="4" fill="#8e8e93" />
    <circle cx="34" cy="21" r="4" fill="#8e8e93" />
    <circle cx="44" cy="21" r="4" fill="#8e8e93" />
  </g>

  <!-- Message 5 -->
  <g transform="translate(10, 120)" class="msg-5">
    <rect width="530" height="42" rx="18.0355" class="bubble" />

    <text x="15" y="27">
      Building useful tools for a decentralized future 🚀
    </text>
  </g>

  <!-- Contact Message -->
  <g transform="translate(10, 168)" class="msg-7">
    <rect width="550" height="42" rx="18.0355" class="bubble" />

    <a href="mailto:hello.dagim@gmail.com">
      <text x="15" y="27">
        Reach out via hello.dagim@gmail.com
      </text>
    </a>

    <text x="390" y="27">or</text>

    <a href="https://x.com/dagimzer" target="_blank">
      <text x="420" y="27" class="emoji">𝕏</text>
    </a>
  </g>

  <!-- Telegram Message -->
  <g transform="translate(10, 216)" class="msg-8">
    <rect width="550" height="42" rx="18.0355" class="bubble" />

    <a href="https://t.me/dagimzer" target="_blank">
      <!-- Telegram logo -->
      <g transform="translate(15, 9)">
        <circle cx="12" cy="12" r="12" fill="#0088cc" />

        <path
          fill="#ffffff"
          d="M9.04 15.51l-.38 5.34c.54 0 .78-.24 1.06-.52l2.55-2.44 5.28 3.87c.97.53 1.66.25 1.92-.9l3.48-16.39c.31-1.44-.52-2-1.46-1.65L2.32 9.59c-1.39.54-1.37 1.31-.24 1.65l5.05 1.58L19.46 5.6c.55-.36 1.05-.16.64.2L9.04 15.51z"
        />
      </g>

      <text x="45" y="27">
        Join my public Telegram channel
      </text>
    </a>
  </g>
</svg>
